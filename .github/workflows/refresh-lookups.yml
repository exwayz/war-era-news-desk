name: Refresh Offline Lookups

on:
  schedule:
    # Daily at 05:30 UTC
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Some hosted runners intermittently drop the git CA bundle, causing
    # "server certificate verification failed. CAfile: none". Pin the system
    # CA bundle explicitly so checkout/push/network calls keep working.
    env:
      GIT_SSL_CAINFO: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_SSL_CAINFO: /etc/ssl/certs/ca-certificates.crt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh offline lookups from live API
        run: node data/refreshLookups.mjs
        env:
          WAE_KEY: ${{ secrets.WAE_KEY }}
      - name: Commit and push if data changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offlineLookups.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to offline lookups."
          else
            git commit -m "chore(data): refresh offline lookups (scheduled)"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Redeploy Pages with fresh data
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
