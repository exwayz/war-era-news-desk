name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Some hosted runners intermittently drop the git CA bundle, causing
    # "server certificate verification failed. CAfile: none" during checkout.
    # Pin the system CA bundle explicitly so verification keeps working.
    env:
      GIT_SSL_CAINFO: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_SSL_CAINFO: /etc/ssl/certs/ca-certificates.crt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - name: Delete stale github-pages artifacts
        run: |
          gh api /repos/${{ github.repository }}/actions/artifacts?per_page=100 \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' \
            | xargs -I{} gh api -X DELETE /repos/${{ github.repository }}/actions/artifacts/{} || true
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1
      - id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 15
